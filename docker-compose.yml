services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: book-publisher:latest
    container_name: book-publisher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Uploaded assets sync to host
      - ../assets/book_publisher:/var/www/storage/app/public
      # Logs (specific folder)
      - ./storage/logs:/var/www/storage/logs
    networks:
      - app_network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: book-publisher-nginx:latest
    container_name: book-publisher-nginx
    restart: unless-stopped
    ports:
      - "8003:80"
    volumes:
      # Nginx config
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      # Uploaded assets (same as app)
      - ../assets/book_publisher:/var/www/storage/app/public
    networks:
      - app_network
    depends_on:
      - app

networks:
  app_network:
    driver: bridge
